* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111318;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
}
header {
  text-align: center;
  padding: 28px 20px 12px;
}
header h1 {
  font-size: 24px;
  font-weight: 500;
  color: #f5f5f5;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
}
header p {
  font-size: 13px;
  color: #777;
}
#map-wrap {
  width: 100%;
  max-width: 1060px;
  margin: 0 auto;
  padding: 0 16px;
}
svg#usmap {
  width: 100%;
  height: auto;
  display: block;
}
.state {
  stroke: #111318;
  stroke-width: 0.8;
  transition: stroke 0.12s, stroke-width 0.12s;
  cursor: pointer;
}
.state:hover {
  stroke: #ffffff;
  stroke-width: 1.8;
}
.state-label {
  font-size: 7.5px;
  font-weight: 500;
  fill: rgba(0,0,0,0.55);
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: middle;
}
#legend {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 10px auto 20px;
}
#legend-bar {
  width: 200px;
  height: 12px;
  border-radius: 3px;
  background: linear-gradient(to right, #ffff00, #ff8800, #ff0000);
}
.leg-label { font-size: 12px; color: #777; padding: 0 10px; }
#tooltip {
  position: fixed;
  display: none;
  background: #1c1f2b;
  border: 1px solid #2d3248;
  border-radius: 12px;
  padding: 16px 18px;
  width: 300px;
  z-index: 9999;
  pointer-events: none;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
}
.tt-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a2d3a;
}
.tt-abbr {
  font-size: 24px;
  font-weight: 600;
  color: #ffffff;
  min-width: 36px;
}
.tt-name { font-size: 14px; font-weight: 500; color: #e8e8e8; }
.tt-sub { font-size: 12px; color: #888; margin-top: 2px; }
.tt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.tt-metric {
  background: #13151e;
  border-radius: 8px;
  padding: 8px 10px;
}
.tt-metric-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
.tt-metric-val { font-size: 14px; font-weight: 500; color: #e0e0e0; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
}
.tag-wisp { background: #0d2b4a; color: #5aa8f8; border: 1px solid #1a4a7a; }
.tag-cable { background: #0d3020; color: #4cd97a; border: 1px solid #1a5a38; }
.tag-acq { background: #3a1515; color: #f87070; border: 1px solid #6a2a2a; }
.tag-notacq { background: #2e2a0d; color: #f0c84a; border: 1px solid #5a520d; }
.tt-sect-title {
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 7px;
}
.comm-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}
.comm-name {
  font-size: 11px;
  color: #aaa;
  width: 48%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.comm-bar-bg {
  flex: 1;
  background: #252836;
  border-radius: 3px;
  height: 5px;
  overflow: hidden;
}
.comm-bar { height: 5px; border-radius: 3px; background: #f0a020; }
.comm-pct { font-size: 11px; font-weight: 500; color: #e0e0e0; min-width: 34px; text-align: right; }
#loading { text-align: center; padding: 60px; color: #555; font-size: 14px; }
</style>
</head>

};

const MIN_T = 11, MAX_T = 433;

function getColor(n) {
  if (!n) return '#222530';
  const t = Math.pow((n - MIN_T) / (MAX_T - MIN_T), 0.55);
  const r = 255;
  const g = Math.round(255 * Math.max(0, 1 - t * 1.3));
  const b = 0;
  return `rgb(${r},${g},${b})`;
}

function fmtRev(v) {
  if (!v) return 'N/A';
  if (v >= 1000) return '$' + (v/1000).toFixed(1) + 'B';
  return '$' + Math.round(v) + 'M';
}

function fmtEmp(v) {
  if (!v) return 'N/A';
  return parseInt(v).toLocaleString();
}

const tooltip = document.getElementById('tooltip');

function showTooltip(e, abbr) {
  const d = stateData[abbr];
  if (!d) return;

  const commRows = Object.entries(d.comm_types).slice(0,5).map(([k,v]) =>
    `<div class="comm-row">
      <span class="comm-name" title="${k}">${k}</span>
      <div class="comm-bar-bg"><div class="comm-bar" style="width:${v}%"></div></div>
      <span class="comm-pct">${v}%</span>
    </div>`).join('');

  tooltip.innerHTML = `
    <div class="tt-head">
      <span class="tt-abbr">${abbr}</span>
      <div>
        <div class="tt-name">${STATE_NAMES[abbr]||abbr}</div>
        <div class="tt-sub">${d.telcos} telcos total</div>
      </div>
    </div>
    <div class="tt-grid">
      <div class="tt-metric">
        <div class="tt-metric-label">Avg Employees</div>
        <div class="tt-metric-val">${fmtEmp(d.avg_emp)}</div>
      </div>
      <div class="tt-metric">
        <div class="tt-metric-label">Avg Revenue</div>
        <div class="tt-metric-val">${fmtRev(d.avg_rev_m)}</div>
      </div>
    </div>
    <div class="tags">
      <span class="tag tag-wisp">WISP: ${d.wisp}</span>
      <span class="tag tag-cable">Cable: ${d.cable}</span>
      <span class="tag tag-acq">Acquired: ${d.acquired}</span>
      <span class="tag tag-notacq">Not Acquired: ${d.not_acquired}</span>
    </div>
    <div class="tt-sect-title">Communication Type Breakdown</div>
    ${commRows || '<div style="font-size:12px;color:#555">No data available</div>'}
  `;
  tooltip.style.display = 'block';
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 18;
  let y = e.clientY - 20;
  if (x + 310 > window.innerWidth) x = e.clientX - 318;
  if (y + 420 > window.innerHeight) y = window.innerHeight - 430;
  if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

// Load TopoJSON from CDN at runtime
fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
  .then(r => r.json())
  .then(us => {
    document.getElementById('loading').style.display = 'none';
    const svg = d3.select('#usmap');
    const projection = d3.geoAlbersUsa().scale(1280).translate([480, 300]);
    const path = d3.geoPath().projection(projection);
    const states = topojson.feature(us, us.objects.states);

    svg.selectAll('.state')
      .data(states.features)
      .join('path')
      .attr('class', 'state')
      .attr('d', path)
      .attr('fill', d => {
        const abbr = FIPS[d.id] || FIPS[String(d.id).padStart(2,'0')];
        const sd = stateData[abbr];
        return getColor(sd ? sd.telcos : null);
      })
      .on('mouseenter', function(e, d) {
        const abbr = FIPS[d.id] || FIPS[String(d.id).padStart(2,'0')];
        if (abbr) showTooltip(e, abbr);
      })
      .on('mousemove', moveTooltip)
      .on('mouseleave', () => { tooltip.style.display = 'none'; });

    // State label centers via projection
    const labelData = [
      {a:'AL',c:[-86.8,32.8]},{a:'AK',c:[-152,64]},{a:'AZ',c:[-111.5,34.3]},{a:'AR',c:[-92.4,34.9]},

      {a:'NH',c:[-71.6,43.7]},{a:'NJ',c:[-74.4,40.1]},{a:'NM',c:[-106.1,34.4]},{a:'NY',c:[-75.1,42.8]},

      {a:'OR',c:[-120.5,44]},{a:'PA',c:[-77.2,40.9]},{a:'RI',c:[-71.5,41.7]},{a:'SC',c:[-80.9,33.8]},
      {a:'SD',c:[-99.9,44.4]},{a:'TN',c:[-86.7,35.9]},{a:'TX',c:[-99.3,31.4]},{a:'UT',c:[-111.5,39.5]},
      {a:'VT',c:[-72.7,44.1]},{a:'VA',c:[-79.4,37.8]},{a:'WA',c:[-120.5,47.4]},{a:'WV',c:[-80.6,38.6]},
      {a:'WI',c:[-89.8,44.5]},{a:'WY',c:[-107.5,43]},{a:'DC',c:[-77.02,38.9]}
    ];

    svg.selectAll('.state-label')
      .data(labelData)
      .join('text')
      .attr('class', 'state-label')
      .attr('x', d => { const p = projection(d.c); return p ? p[0] : -999; })
      .attr('y', d => { const p = projection(d.c); return p ? p[1] : -999; })
      .text(d => d.a);
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Failed to load map. Please check your internet connection.';
  });
